<app-home></app-home>

<div class="admin-shell">
  <button class="menu-toggle btn-secondary" (click)="menuOpen = !menuOpen">
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    Admin menyu
  </button>

  <aside class="sidebar" [class.open]="menuOpen">
    <div class="brand">
      <mat-icon>admin_panel_settings</mat-icon>
      <div>
        <div class="brand-title">Admin panel</div>
        <div class="brand-sub">Super Admin</div>
      </div>
    </div>

    <div class="group-label">Tahlil</div>
    <a *ngFor="let item of analytics" class="nav-item" [routerLink]="item.link" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: !!item.exact }" (click)="menuOpen = false">
      <mat-icon>{{ item.icon }}</mat-icon>{{ item.label }}
    </a>

    <div class="group-label">Boshqaruv</div>
    <a *ngFor="let item of management" class="nav-item" [routerLink]="item.link" (click)="menuOpen = false">
      <mat-icon>{{ item.icon }}</mat-icon>{{ item.label }}
      <mat-icon class="ext">chevron_right</mat-icon>
    </a>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
