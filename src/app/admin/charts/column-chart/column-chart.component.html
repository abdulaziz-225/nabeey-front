<div class="chart-wrap" (mouseleave)="hovered = null">
  <svg [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="none" class="chart-svg" [style.height.px]="height"
       role="img" [attr.aria-label]="seriesName">
    <line *ngFor="let t of ticks" class="grid" [attr.x1]="pad.left" [attr.x2]="width - pad.right" [attr.y1]="t.y" [attr.y2]="t.y"></line>
    <path *ngFor="let b of bars; let i = index" [attr.d]="barPath(b)" [attr.fill]="color"
          [attr.opacity]="hovered === null || hovered === i ? 1 : 0.45"></path>
    <line class="baseline" [attr.x1]="pad.left" [attr.x2]="width - pad.right" [attr.y1]="plotBottom" [attr.y2]="plotBottom"></line>
    <rect *ngFor="let b of bars; let i = index" class="hit" [attr.x]="b.hitX" [attr.y]="pad.top" [attr.width]="b.hitW"
          [attr.height]="plotBottom - pad.top" (mouseenter)="hovered = i"></rect>
  </svg>

  <div class="y-labels" [style.height.px]="height">
    <span *ngFor="let t of ticks" [style.top.px]="t.y">{{ t.value }}</span>
  </div>
  <div class="x-labels">
    <span *ngFor="let l of xLabels" [style.left.%]="(l.x / width) * 100">{{ l.text }}</span>
  </div>

  <div class="chart-tooltip" *ngIf="hovered !== null" [style.left]="tooltipLeft(hovered)">
    <div class="tt-title">{{ bars[hovered].point.label }}</div>
    <div class="tt-row"><span class="swatch" [style.background]="color"></span>{{ seriesName }}<b>{{ bars[hovered].point.value }}</b></div>
  </div>
</div>
