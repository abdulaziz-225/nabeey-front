<h2 mat-dialog-title>Quizni boshlash</h2>
<mat-dialog-content>
  <p>Siz <span class="font-bold text-[18px]">  "{{ book.title }}" </span> quizini ishlashga tayyormisiz?</p>
</mat-dialog-content>
<mat-dialog-actions  class="!mb-4 !mr-2 !justify-end">
  <button class="btn-secondary" (click)="closeDialog('cancel')">Yo'q</button>
  <button class="btn-primary" (click)="closeDialog('start')">Ha</button>
</mat-dialog-actions>
